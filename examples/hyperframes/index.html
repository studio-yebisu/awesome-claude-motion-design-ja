<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Frame by frame</title>
<style>@font-face{font-family:Plate;src:url('./fonts/inter.woff2')}@font-face{font-family:Mono;src:url('./fonts/mono.woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#film{position:relative;width:100%;height:100%;background:#f2efe8;color:#171510;font-family:Plate}.kicker{position:absolute;left:40px;top:47px;font:18px Mono}.hero{position:absolute;left:35px;top:114px;font-size:110px;line-height:.9;letter-spacing:-.045em}.card{position:absolute;top:290px;width:267px;height:220px;border:1px solid #bdb7ab;padding:22px;border-radius:6px;background:#ebe6da}.num{font:18px Mono}.title{font-size:30px;margin-top:32px}.line{height:7px;background:#c24a25;margin-top:30px;transform-origin:left}.foot{position:absolute;left:40px;bottom:22px;font:16px Mono}</style></head>
<body><div id="film" data-composition-id="film" data-width="960" data-height="600" data-duration="8" data-fps="30">
<div class="clip" data-start="0" data-duration="8" data-track-index="0"><div class="kicker">HTML / A SEEKABLE FILM</div><div class="hero">Frame<br>by frame.</div><div class="foot">HYPERFRAMES / HTML + GSAP → MP4</div></div>
<div class="clip" data-start="0" data-duration="8" data-track-index="1"><div class="card" style="left:40px"><div class="num">01 / WRITE</div><div class="title">Set the stage.</div><div class="line"></div></div><div class="card" style="left:345px"><div class="num">02 / SEEK</div><div class="title">Find the beat.</div><div class="line"></div></div><div class="card" style="left:650px"><div class="num">03 / RENDER</div><div class="title">Keep the frame.</div><div class="line"></div></div></div>
</div><script src="./node_modules/gsap/dist/gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});
tl.to('.hero',{scale:.53,y:-35,duration:.8,ease:'power3.inOut'},.5)
 .fromTo('.card',{y:160,opacity:0},{y:0,opacity:1,duration:.8,stagger:.18,ease:'power3.out'},1.1)
 .fromTo('.line',{scaleX:0},{scaleX:1,duration:.7,stagger:.6,ease:'expo.out'},2)
 .to('.card',{y:160,opacity:0,duration:.5,stagger:.12,ease:'power3.in'},6)
 .to('.hero',{scale:1,y:0,duration:.8,ease:'power3.inOut'},6.9);
window.__timelines['film']=tl;
</script></body></html>
